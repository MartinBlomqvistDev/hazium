[project]
name = "hazium"
version = "0.0.1"
description = "Explainable ML platform for early detection of emerging environmental and public health hazards from public data"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pydantic>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "gensim>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Pinned deliberately. CI installs this fresh on every run, so an unpinned
    # linter means an upstream release can turn the build red without a line of
    # code changing: ruff 0.16.0 did exactly that, flagging 68 pre-existing
    # issues under newly-stable rules. Bump this on purpose, with the fixes in
    # the same commit, rather than discovering it on an unrelated push.
    "ruff==0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hazium"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
